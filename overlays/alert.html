<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; font-family: "Segoe UI", sans-serif; }
      .alert {
        position: absolute; left: 50%; top: 18%; transform: translateX(-50%) translateY(12px);
        min-width: 420px; text-align: center; opacity: 0; color: white;
        transition: opacity 0.25s ease, transform 0.25s ease;
      }
      .alert.on { opacity: 1; transform: translateX(-50%) translateY(0); }
      h1 { margin: 0; font-size: 64px; letter-spacing: -0.04em; text-shadow: 0 8px 30px rgba(0,0,0,0.6); }
      p { margin: 8px 0 0; font-size: 28px; color: #e7ffe0; }
    </style>
  </head>
  <body>
    <div class="alert" id="alert"><h1 id="title"></h1><p id="detail"></p></div>
    <script>
      const box = document.getElementById('alert');
      const socket = new WebSocket(`ws://${location.host}`);
      let timer;
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type !== 'alert') return;
        document.getElementById('title').textContent = message.alert.title;
        document.getElementById('detail').textContent = message.alert.detail;
        document.getElementById('title').style.color = message.alert.color || '#53fc18';
        box.classList.add('on');
        clearTimeout(timer);
        timer = setTimeout(() => box.classList.remove('on'), Math.max(1500, (message.alert.duration || 6000) - 400));
      };
    </script>
  </body>
</html>
